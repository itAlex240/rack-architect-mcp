name: CI — Typecheck, Catalog Validation, Build & Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Strict TypeScript 5.9, Catalog & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all 6 monorepo packages in topological order
        run: pnpm build

      - name: Run strict TypeScript compiler gates (typecheck)
        run: pnpm -r run typecheck

      - name: Validate all YAML hardware blueprints & port matrices
        run: pnpm validate:catalog

      - name: Run all 34 Vitest unit & integration suites
        run: pnpm test
