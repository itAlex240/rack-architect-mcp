name: Release — Build CAD Deliverables & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Attach Reference CAD Deliverables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install, Build & Test
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Generate Reference CAD Deliverables (SVG, BOM, GLB, OpenSCAD, STL)
        run: pnpm export:demo

      - name: Create GitHub Release with CAD & 3D-Print Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            examples/10inch-homelab/rack.yaml
            examples/10inch-homelab/elevation.svg
            examples/10inch-homelab/wiring-schematic.svg
            examples/10inch-homelab/BOM.md
            examples/10inch-homelab/rack-scene.glb
            examples/10inch-homelab/3dprint-10inch-ucg-ultra-plus-3keystone.scad
            examples/10inch-homelab/3dprint-10inch-ucg-ultra-plus-3keystone.stl
            examples/10inch-homelab/3dprint-10inch-lenovo-tiny-plus-2keystone.scad
            examples/10inch-homelab/3dprint-10inch-lenovo-tiny-plus-2keystone.stl
