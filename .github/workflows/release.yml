name: Release — Build CAD Deliverables & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build & Attach Reference CAD Deliverables
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install, Build, Typecheck & Test
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm -r run typecheck
          pnpm test

      - name: Generate Reference CAD Deliverables (SVG, BOM, GLB, OpenSCAD, STL)
        run: pnpm export:demo

      - name: Build MCPB Bundle (rack-architect-mcp.mcpb) and Update server.json SHA-256
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf rack-architect-mcp.mcpb \
            package.json README.md LICENSE server.json \
            packages/core-domain/package.json packages/core-domain/dist \
            packages/hardware-catalog/package.json packages/hardware-catalog/dist \
            packages/exporters/package.json packages/exporters/dist \
            packages/mcp-server/package.json packages/mcp-server/dist \
            packages/web-viewer/package.json packages/web-viewer/dist \
            packages/cli/package.json packages/cli/dist
          SHA256="$(sha256sum rack-architect-mcp.mcpb | awk '{print $1}')"
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.version = process.argv[1];
            s.packages[0].identifier = `https://github.com/itAlex240/rack-architect-mcp/releases/download/v${process.argv[1]}/rack-architect-mcp.mcpb`;
            s.packages[0].fileSha256 = process.argv[2];
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n", "utf8");
          ' "$VERSION" "$SHA256"

      - name: Create GitHub Release with Beginner-Friendly Guide & CAD/3D-Print Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "🏗️ RackArchitect MCP ${{ github.ref_name }} — 3D/2D Rack-Planer, Baupläne & 3D-Druck-Dateien (.STL)"
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            rack-architect-mcp.mcpb
            examples/10inch-homelab/rack.yaml
            examples/10inch-homelab/elevation.svg
            examples/10inch-homelab/wiring-schematic.svg
            examples/10inch-homelab/BOM.md
            examples/10inch-homelab/rack-scene.glb
            examples/10inch-homelab/3dprint-10inch-ucg-ultra-plus-3keystone.scad
            examples/10inch-homelab/3dprint-10inch-ucg-ultra-plus-3keystone.stl
            examples/10inch-homelab/3dprint-10inch-lenovo-tiny-plus-2keystone.scad
            examples/10inch-homelab/3dprint-10inch-lenovo-tiny-plus-2keystone.stl

      - name: Curate GitHub Releases Page (Keep Top 3 Recent Releases & Archive Older Ones)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            async function curateReleases() {
              const repo = process.env.REPO;
              const token = process.env.GITHUB_TOKEN;
              const currentTag = process.env.CURRENT_TAG;
              const headers = {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "rack-architect-release-curator"
              };

              const res = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=100`, { headers });
              if (!res.ok) {
                console.warn("Could not list releases:", res.status, await res.text());
                return;
              }
              const releases = await res.json();
              releases.sort((a, b) => {
                if (a.tag_name === currentTag) return -1;
                if (b.tag_name === currentTag) return 1;
                return new Date(b.created_at).getTime() - new Date(a.created_at).getTime();
              });

              const KEEP_COUNT = 3;
              const kept = releases.slice(0, KEEP_COUNT);
              const toArchive = releases.slice(KEEP_COUNT);

              // Collapse the repetitive Quick-Start guide on the #2 and #3 releases so the page stays compact
              for (let i = 1; i < kept.length; i++) {
                const rel = kept[i];
                let body = rel.body || "";
                if (!body.includes("<!-- COMPACTED_SECONDARY_RELEASE -->")) {
                  const summaryHeader = `<details>\n<summary>📖 <b>Einsteiger-Anleitung & Asset-Erklärung aufklappen / Expand Quick-Start Guide (${rel.tag_name})</b></summary>\n\n`;
                  if (body.includes("<!-- BEGIN_QUICKSTART_GUIDE -->") && body.includes("<!-- END_QUICKSTART_GUIDE -->")) {
                    body = body
                      .replace("<!-- BEGIN_QUICKSTART_GUIDE -->", `<!-- COMPACTED_SECONDARY_RELEASE -->\n${summaryHeader}`)
                      .replace("<!-- END_QUICKSTART_GUIDE -->", "\n</details>");
                  } else if (body.includes("## 🇩🇪 Anleitung")) {
                    const splitIdx = body.indexOf("## 🇩🇪 Anleitung");
                    body = `${body.slice(0, splitIdx)}<!-- COMPACTED_SECONDARY_RELEASE -->\n${summaryHeader}${body.slice(splitIdx)}\n</details>\n`;
                  }
                  // Also trim oversized legacy bullet lists in #2/#3 if > 3 bullets exist
                  const lines = body.split("\n");
                  const compactLines = [];
                  let quoteBulletCount = 0;
                  for (const line of lines) {
                    if (line.startsWith("> - **")) {
                      quoteBulletCount++;
                      if (quoteBulletCount <= 2) {
                        compactLines.push(line);
                      } else if (quoteBulletCount === 3) {
                        compactLines.push(`> - *Ältere Änderungen siehe [\`docs/RELEASE_ARCHIVE.md\`](https://github.com/${repo}/blob/main/docs/RELEASE_ARCHIVE.md) & [\`CHANGELOG.md\`](https://github.com/${repo}/blob/main/CHANGELOG.md).*`);
                      }
                    } else {
                      compactLines.push(line);
                    }
                  }
                  const updatedBody = compactLines.join("\n");
                  if (updatedBody !== rel.body) {
                    const patchRes = await fetch(`https://api.github.com/repos/${repo}/releases/${rel.id}`, {
                      method: "PATCH",
                      headers: { ...headers, "Content-Type": "application/json" },
                      body: JSON.stringify({ body: updatedBody })
                    });
                    console.log(`Compacted secondary release ${rel.tag_name}: HTTP ${patchRes.status}`);
                  }
                }
              }

              // Delete older GitHub Release entries (> Top 3) while keeping their Git tags intact
              for (const oldRel of toArchive) {
                const delRes = await fetch(`https://api.github.com/repos/${repo}/releases/${oldRel.id}`, {
                  method: "DELETE",
                  headers
                });
                console.log(`Archived (removed from Releases feed, Git tag preserved) ${oldRel.tag_name}: HTTP ${delRes.status}`);
              }
            }
            curateReleases().catch((err) => {
              console.warn("Release curation warning:", err);
            });
          '

      - name: Publish Server to Official MCP Registry (registry.modelcontextprotocol.io)
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Log in to GitHub Container Registry (ghcr.io)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to ghcr.io/italex240/rack-architect-mcp
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build \
            -t "ghcr.io/italex240/rack-architect-mcp:${VERSION}" \
            -t "ghcr.io/italex240/rack-architect-mcp:latest" \
            .
          docker push "ghcr.io/italex240/rack-architect-mcp:${VERSION}"
          docker push "ghcr.io/italex240/rack-architect-mcp:latest"
