name: Deploy Live 3D Web-Viewer Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy-web-viewer:
    name: Build & Publish Standalone 3D/2D Web-Viewer (gh-pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @rack-mcp/web-viewer static bundle
        run: |
          pnpm --filter @rack-mcp/core-domain build
          pnpm --filter @rack-mcp/hardware-catalog build
          pnpm --filter @rack-mcp/web-viewer build
          touch packages/web-viewer/dist/.nojekyll

      - name: Deploy static bundle to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/web-viewer/dist
          force_orphan: true
